<section class="join-form">

  <h2>Enroll Now</h2>

  <form id="gymForm">

    <input type="text" id="name" placeholder="Your Name" required>

    <input type="tel" id="phone" placeholder="Phone Number" required>

    <input type="email" id="email" placeholder="Your Email" required>

    <button type="submit">ENROLL NOW</button>

  </form>

</section>

<style>

.join-form{
  padding:60px 20px;
  background:#f5f5f5;
  text-align:center;
}

.join-form h2{
  font-size:48px;
  margin-bottom:30px;
  font-weight:bold;
}

#gymForm{
  max-width:500px;
  margin:auto;
  background:white;
  padding:40px;
  border-radius:20px;
  box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

#gymForm input{
  width:100%;
  padding:15px;
  margin-bottom:20px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:18px;
}

#gymForm button{
  background:#ff4d00;
  color:white;
  border:none;
  padding:15px 40px;
  font-size:20px;
  border-radius:10px;
  cursor:pointer;
  transition:0.3s;
}

#gymForm button:hover{
  background:#e63e00;
}

</style>

<script>

document.getElementById("gymForm").addEventListener("submit", function(e){

e.preventDefault();

const name = document.getElementById("name").value;
const phone = document.getElementById("phone").value;
const email = document.getElementById("email").value;

/*
IMPORTANT:

You must replace these ENTRY IDs with your real Google Form entry IDs.

HOW TO GET THEM:

1. Open Google Form
2. Click ⋮ (3 dots)
3. Get pre-filled link
4. Fill sample data
5. Click Get Link
6. Copy the generated URL
7. You will see:

entry.123456=value

Use those numbers below.
*/

const formURL =
"https://docs.google.com/forms/d/e/1FAIpQLSdeK9K7FniCCoQ6ZM5wgDPqf9EogE5in6nQBxuxEQiokxJQ6w/formResponse?"
+ "entry.111111=" + encodeURIComponent(name)
+ "&entry.222222=" + encodeURIComponent(phone)
+ "&entry.333333=" + encodeURIComponent(email);

fetch(formURL,{
method:"POST",
mode:"no-cors"
});

alert("Enrollment Successful!");

document.getElementById("gymForm").reset();

});

</script>
